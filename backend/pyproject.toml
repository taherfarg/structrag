[project]
name = "structrag"
version = "0.1.0"
description = "Structure-aware RAG platform: vector vs structure routing vs hybrid, measured."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "markdown-it-py>=3",
    "tiktoken>=0.7",
    "pyjwt[crypto]>=2.8",
    "supabase>=2.10",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
rerank = ["fastembed>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
structrag = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: needs the local Supabase stack (npx supabase start)"]
